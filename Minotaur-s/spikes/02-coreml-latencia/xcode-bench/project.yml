# Projeto de MEDIÇÃO (não é o app principal). App iOS mínimo que carrega os
# .mlpackage dos candidatos NLI do Spike 2c e, para cada um, roda .predict()
# em device verificando se os logits batem com a referência PyTorch (Filtro 2).
#
# Uso:
#   1) Rode ../../02c-nli-executavel/convert_and_reference.py (gera os
#      .mlpackage INT8 + manifest.json em ../../02c-nli-executavel/build/).
#   2) xcodegen generate   (dentro desta pasta)
#   3) Rode em simulador iOS 18.6 e em iPhone físico (ver run_bench.sh).
#
# Env opcionais (isolam crashes): BENCH_MODEL=<short> BENCH_UNITS=all|cpuOnly.
name: CoreMLBench
options:
  bundleIdPrefix: com.spike.coremlbench
targets:
  CoreMLBench:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: ../../02c-nli-executavel/build/manifest.json
        buildPhase: resources
        optional: true
      - path: ../../02c-nli-executavel/build/L6_int8.mlpackage
        buildPhase: resources
        optional: true
      - path: ../../02c-nli-executavel/build/L12_int8.mlpackage
        buildPhase: resources
        optional: true
      - path: ../../02c-nli-executavel/build/symanto_int8.mlpackage
        buildPhase: resources
        optional: true
      - path: ../../02c-nli-executavel/build/erniem_int8.mlpackage
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.coremlbench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
